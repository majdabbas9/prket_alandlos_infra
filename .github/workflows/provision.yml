name: Provision

# One workflow for all Cloudflare provisioning, for two environments:
#   dev  - every push to master (i.e. every merge)
#   prod - only when run by hand: Actions -> Provision -> Run workflow -> environment: prod
#
# Jobs:
#   config     - resolve the environment's settings (scripts/env-config.mjs): names,
#                hostnames from <ENV>_URL, account / database IDs
#   storage    - terraform: create/adopt the R2 bucket (+ its public CDN domain); the D1
#                database already exists and is only referenced
#   seed       - D1 users table + admin user; dev also gets the sample products in R2
#   deploy     - deploy both APIs to Cloudflare Containers (containers/)
#   it-*       - integration tests against the deployed APIs (it-backend.yml,
#                it-admin-backend.yml; also runnable on their own)
#   frontends  - build both frontends and publish them to Cloudflare Pages
# (cloudflare/ - Pages + DNS terraform - is not wired into CI for now.)
# PRs run the dev terraform plan only.
#
# Variables and secrets are read as <ENV>_<NAME> first, then <NAME>:
#   vars:    DEV_/PROD_ CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_DATABASE_ID, URL,
#            optional R2_BUCKET_NAME, TF_STATE_BUCKET
#   secrets: DEV_/PROD_ CLOUDFLARE_API_TOKEN, ACCESS_KEY_ID, SECRET_ACCESS_KEY,
#            ADMIN_USERNAME, ADMIN_PASSWORD, optional D1_API_TOKEN, JWT_SECRET
on:
  push:
    branches: [master]
    paths:
      - 'storage/**'
      - 'seed/**'
      - 'containers/**'
      - 'scripts/**'
      - '.github/workflows/provision.yml'
  pull_request:
    paths:
      - 'storage/**'
      - '.github/workflows/provision.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to provision'
        type: choice
        options: ['dev', 'prod']
        default: 'dev'
      reset_admin_password:
        description: 'Overwrite the admin password if the user already exists'
        type: boolean
        default: false

# R2-backed state has no lock; serialize runs per environment.
concurrency:
  group: provision-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.config.outputs.env }}
      prefix: ${{ steps.config.outputs.prefix }}
      gh_environment: ${{ steps.config.outputs.gh_environment }}
      account_id: ${{ steps.config.outputs.account_id }}
      database_id: ${{ steps.config.outputs.database_id }}
      r2_bucket: ${{ steps.config.outputs.r2_bucket }}
      state_bucket: ${{ steps.config.outputs.state_bucket }}
      state_key: ${{ steps.config.outputs.state_key }}
      worker: ${{ steps.config.outputs.worker }}
      site_project: ${{ steps.config.outputs.site_project }}
      admin_project: ${{ steps.config.outputs.admin_project }}
      seed_samples: ${{ steps.config.outputs.seed_samples }}
      zone_id: ${{ steps.config.outputs.zone_id }}
      site: ${{ steps.config.outputs.site }}
      admin: ${{ steps.config.outputs.admin }}
      api: ${{ steps.config.outputs.api }}
      images: ${{ steps.config.outputs.images }}
      api_url: ${{ steps.config.outputs.api_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve ${{ inputs.environment || 'dev' }} settings
        id: config
        run: node scripts/env-config.mjs | tee -a "$GITHUB_OUTPUT"
        env:
          ENV_NAME: ${{ inputs.environment || 'dev' }}
          VARS_JSON: ${{ toJSON(vars) }}
          CLOUDFLARE_API_TOKEN: ${{ secrets[format('{0}_CLOUDFLARE_API_TOKEN', inputs.environment == 'prod' && 'PROD' || 'DEV')] || secrets.CLOUDFLARE_API_TOKEN }}

  storage:
    needs: config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storage
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      CLOUDFLARE_ACCOUNT_ID: ${{ needs.config.outputs.account_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets[format('{0}_CLOUDFLARE_API_TOKEN', needs.config.outputs.prefix)] || secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets[format('{0}_ACCESS_KEY_ID', needs.config.outputs.prefix)] || secrets.ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets[format('{0}_SECRET_ACCESS_KEY', needs.config.outputs.prefix)] || secrets.SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ needs.config.outputs.r2_bucket }}
      STATE_BUCKET: ${{ needs.config.outputs.state_bucket }}
      TF_VAR_cloudflare_account_id: ${{ needs.config.outputs.account_id }}
      TF_VAR_r2_bucket_name: ${{ needs.config.outputs.r2_bucket }}
      TF_VAR_cloudflare_database_id: ${{ needs.config.outputs.database_id }}
      TF_VAR_r2_public_domain: ${{ needs.config.outputs.images }}
      TF_VAR_r2_public_zone_id: ${{ needs.config.outputs.zone_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      # Terraform keeps its state in this bucket, so it can't create it: done here on the
      # first run of an environment (PRs only check).
      - name: Ensure Terraform state bucket
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "$auth" "$api/$STATE_BUCKET")
          if [ "$code" = "200" ]; then exit 0; fi
          if [ "$code" != "404" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::error::State bucket '$STATE_BUCKET' not available (HTTP $code)"; exit 1
          fi
          created=$(curl -s -X POST -H "$auth" -H 'Content-Type: application/json' \
            --data "{\"name\":\"$STATE_BUCKET\"}" "$api")
          if [ "$(jq -r '.success' <<<"$created")" != "true" ]; then
            echo "::error::Creating state bucket '$STATE_BUCKET' failed: $(jq -c '.errors' <<<"$created")"; exit 1
          fi
          echo "Created state bucket $STATE_BUCKET"

      - name: Terraform init
        run: |
          {
            echo "bucket    = \"$STATE_BUCKET\""
            echo "key       = \"${{ needs.config.outputs.state_key }}\""
            echo "endpoints = { s3 = \"https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com\" }"
          } > backend.hcl
          terraform init -backend-config=backend.hcl

      - name: Terraform fmt / validate
        run: |
          terraform fmt -check
          terraform validate

      # An existing bucket is adopted into state instead of failing on "already exists".
      - name: Import existing resources
        if: github.event_name != 'pull_request'
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          state=$(terraform state list || true)

          if ! grep -qx 'cloudflare_r2_bucket.assets' <<<"$state" \
             && [ "$(curl -s -o /dev/null -w '%{http_code}' -H "$auth" "$api/r2/buckets/$R2_BUCKET_NAME")" = "200" ]; then
            terraform import cloudflare_r2_bucket.assets "$CLOUDFLARE_ACCOUNT_ID/$R2_BUCKET_NAME/default"
          fi

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false tfplan

  seed:
    needs: [config, storage]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seed
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ needs.config.outputs.account_id }}
      R2_BUCKET_NAME: ${{ needs.config.outputs.r2_bucket }}
      ACCESS_KEY_ID: ${{ secrets[format('{0}_ACCESS_KEY_ID', needs.config.outputs.prefix)] || secrets.ACCESS_KEY_ID }}
      SECRET_ACCESS_KEY: ${{ secrets[format('{0}_SECRET_ACCESS_KEY', needs.config.outputs.prefix)] || secrets.SECRET_ACCESS_KEY }}
      SEED_SAMPLE_PRODUCTS: ${{ needs.config.outputs.seed_samples }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - name: Seed R2 and D1 admin user
        run: node provision.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets[format('{0}_CLOUDFLARE_API_TOKEN', needs.config.outputs.prefix)] || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DATABASE_ID: ${{ needs.config.outputs.database_id }}
          ADMIN_USERNAME: ${{ secrets[format('{0}_ADMIN_USERNAME', needs.config.outputs.prefix)] || secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets[format('{0}_ADMIN_PASSWORD', needs.config.outputs.prefix)] || secrets.ADMIN_PASSWORD }}
          RESET_ADMIN_PASSWORD: ${{ inputs.reset_admin_password }}

      - name: Verify R2 contains images
        if: env.SEED_SAMPLE_PRODUCTS == 'true'
        run: |
          node --input-type=module <<'JS'
          import { S3Client, ListObjectsV2Command } from '@aws-sdk/client-s3';
          const s3 = new S3Client({
            region: 'auto',
            endpoint: `https://${process.env.CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com`,
            credentials: { accessKeyId: process.env.ACCESS_KEY_ID, secretAccessKey: process.env.SECRET_ACCESS_KEY },
          });
          const r = await s3.send(new ListObjectsV2Command({ Bucket: process.env.R2_BUCKET_NAME, Prefix: 'products/' }));
          const imgs = (r.Contents ?? []).filter((o) => /\.(jpe?g|png|webp)$/i.test(o.Key));
          console.log(`Images in R2 under products/: ${imgs.length}`);
          if (imgs.length === 0) { console.error('No images found in R2'); process.exit(1); }
          JS

  # Wraps the latest GHCR backend images (containers/*.Dockerfile) and deploys them
  # as Cloudflare Containers behind one Worker. Backend repos don't trigger this:
  # after pushing backend changes, re-run it via workflow_dispatch.
  deploy:
    needs: [config, storage, seed]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.gh_environment }}
    defaults:
      run:
        working-directory: containers
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ needs.config.outputs.account_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets[format('{0}_CLOUDFLARE_API_TOKEN', needs.config.outputs.prefix)] || secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_NAME: ${{ needs.config.outputs.worker }}
      R2_BUCKET_NAME: ${{ needs.config.outputs.r2_bucket }}
      API_DOMAIN: ${{ needs.config.outputs.api }}
      IMAGES_DOMAIN: ${{ needs.config.outputs.images }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22  # wrangler 4 requires Node >= 22

      # The GHCR packages are private, but the backend repos are public: build the
      # images from source under the same tags, so the FROM lines in
      # containers/*.Dockerfile resolve to these local images instead of pulling.
      - name: Build backend images from source
        working-directory: .
        run: |
          for repo in prket_alandlos_backend prket_alandlos_admin_backend; do
            git clone --depth 1 "https://github.com/${{ github.repository_owner }}/$repo.git" "$RUNNER_TEMP/$repo"
            docker build -t "ghcr.io/majdabbas9/$repo:latest" "$RUNNER_TEMP/$repo"
          done

      - run: npm ci --no-audit --no-fund

      - run: npx tsc --noEmit

      # wrangler.jsonc with this environment's Worker name and bucket
      - name: Write environment wrangler config
        run: |
          node -e '
            const fs = require("fs");
            const ts = require("typescript");
            const { config, error } = ts.parseConfigFileTextToJson("wrangler.jsonc", fs.readFileSync("wrangler.jsonc", "utf8"));
            if (error) throw new Error(ts.flattenDiagnosticMessageText(error.messageText, "\n"));
            config.name = process.env.WORKER_NAME;
            config.r2_buckets.find((b) => b.binding === "BUCKET").bucket_name = process.env.R2_BUCKET_NAME;
            config.vars.R2_BUCKET_NAME = process.env.R2_BUCKET_NAME;
            fs.writeFileSync("wrangler.ci.json", JSON.stringify(config, null, 2));
          '
          echo "Worker $WORKER_NAME, bucket $R2_BUCKET_NAME"

      # --domain makes wrangler create the DNS record + certificate for the API hostname
      # (token needs Zone > Workers Routes: Edit). With a public bucket domain, the backend
      # hands out CDN image URLs (R2_PUBLIC_URL).
      - name: Deploy Worker + containers
        run: |
          args=(--config wrangler.ci.json)
          [ -n "$API_DOMAIN" ] && args+=(--domain "$API_DOMAIN")
          [ -n "$IMAGES_DOMAIN" ] && args+=(--var "R2_PUBLIC_URL:https://$IMAGES_DOMAIN")
          npx wrangler deploy "${args[@]}"

      # Set after deploy so the first deploy can create the Worker; changing
      # secrets rolls a new version, so containers restart with the new values.
      # JWT_SECRET only lives on the Worker: without a GitHub secret it is
      # generated once and then left alone (rotating it logs every admin out).
      - name: Sync secrets
        run: |
          set -o pipefail
          if [ -z "$JWT_SECRET" ]; then
            if npx wrangler secret list --config wrangler.ci.json --format json | grep -q '"JWT_SECRET"'; then
              echo "JWT_SECRET: keeping the value already on the Worker"
              export SKIP_JWT=1
            else
              echo "JWT_SECRET: generating a new one"
              JWT_SECRET=$(openssl rand -hex 48)
              echo "::add-mask::$JWT_SECRET"
              export JWT_SECRET
            fi
          fi
          node -e '
            const keys = ["ACCESS_KEY_ID","SECRET_ACCESS_KEY","CLOUDFLARE_ACCOUNT_ID","CLOUDFLARE_DATABASE_ID","D1_API_TOKEN"];
            if (!process.env.SKIP_JWT) keys.push("JWT_SECRET");
            const missing = keys.filter((k) => !process.env[k]);
            if (missing.length) { console.error("Missing: " + missing.join(", ")); process.exit(1); }
            console.log(JSON.stringify(Object.fromEntries(keys.map((k) => [k, process.env[k]]))));
          ' | npx wrangler secret bulk --config wrangler.ci.json
        env:
          ACCESS_KEY_ID: ${{ secrets[format('{0}_ACCESS_KEY_ID', needs.config.outputs.prefix)] || secrets.ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets[format('{0}_SECRET_ACCESS_KEY', needs.config.outputs.prefix)] || secrets.SECRET_ACCESS_KEY }}
          CLOUDFLARE_DATABASE_ID: ${{ needs.config.outputs.database_id }}
          D1_API_TOKEN: ${{ secrets[format('{0}_D1_API_TOKEN', needs.config.outputs.prefix)] || secrets.D1_API_TOKEN || secrets[format('{0}_CLOUDFLARE_API_TOKEN', needs.config.outputs.prefix)] || secrets.CLOUDFLARE_API_TOKEN }}
          JWT_SECRET: ${{ secrets[format('{0}_JWT_SECRET', needs.config.outputs.prefix)] || secrets.JWT_SECRET }}

  # Integration tests against the APIs just deployed. Skipped with deploy on PRs.
  it-backend:
    needs: [config, deploy]
    uses: ./.github/workflows/it-backend.yml
    with:
      environment: ${{ needs.config.outputs.env }}
      api_url: ${{ needs.config.outputs.api_url }}
    secrets: inherit

  it-admin-backend:
    needs: [config, deploy]
    uses: ./.github/workflows/it-admin-backend.yml
    with:
      environment: ${{ needs.config.outputs.env }}
      api_url: ${{ needs.config.outputs.api_url }}
    secrets: inherit

  # Static SPAs on Cloudflare Pages (free). VITE_* URLs are baked in at build
  # time, so they point at this environment's API. Like deploy, frontend repos don't
  # trigger this: re-run via workflow_dispatch after pushing frontend changes.
  frontends:
    needs: [config, deploy]
    runs-on: ubuntu-latest
    environment: ${{ needs.config.outputs.gh_environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: prket_alandlos_frontend
            host: site
          - repo: prket_alandlos_admin_frontend
            host: admin
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ needs.config.outputs.account_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets[format('{0}_CLOUDFLARE_API_TOKEN', needs.config.outputs.prefix)] || secrets.CLOUDFLARE_API_TOKEN }}
      API_URL: ${{ needs.config.outputs.api_url }}
      PROJECT: ${{ needs.config.outputs[format('{0}_project', matrix.host)] }}
      # Custom hostname for this project (from <ENV>_URL); empty = pages.dev only
      DOMAIN: ${{ needs.config.outputs[matrix.host] }}
      ZONE_ID: ${{ needs.config.outputs.zone_id }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # wrangler 4 requires Node >= 22

      - name: Build
        run: |
          git clone --depth 1 "https://github.com/${{ github.repository_owner }}/${{ matrix.repo }}.git" app
          cd app
          npm ci --no-audit --no-fund
          npm run build
        env:
          VITE_SERVER_URL: ${{ env.API_URL }}
          VITE_ADMIN_BACKEND_URL: ${{ env.API_URL }}

      - name: Create Pages project if missing
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT")
          if [ "$code" = "404" ]; then
            npx wrangler@4.149.0 pages project create "$PROJECT" --production-branch main
          elif [ "$code" != "200" ]; then
            echo "Pages API returned HTTP $code (token needs Account > Cloudflare Pages: Edit)"; exit 1
          fi

      - name: Deploy to Pages
        working-directory: app
        run: |
          npx wrangler@4.149.0 pages deploy dist --project-name "$PROJECT" --branch main --commit-dirty=true
          echo "${{ matrix.repo }} -> https://$PROJECT.pages.dev" >> "$GITHUB_STEP_SUMMARY"

      # Attaches the custom domain to the Pages project and points a proxied CNAME at
      # <project>.pages.dev (the API doesn't create the record the way the dashboard does).
      # Token needs Zone > DNS: Edit. Domains this project no longer uses (after <ENV>_URL
      # changed) are detached, and a CNAME still pointing at another of this stack's Pages
      # projects is repointed, so a hostname can move between environments.
      - name: Attach custom domain
        if: env.DOMAIN != ''
        run: |
          api="https://api.cloudflare.com/client/v4"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          project_api="$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains"
          target="$PROJECT.pages.dev"

          for old in $(curl -sf -H "$auth" "$project_api" | jq -r '.result[].name'); do
            [ "$old" = "$DOMAIN" ] && continue
            curl -sf -X DELETE -H "$auth" "$project_api/$old" > /dev/null
            echo "Detached old domain $old from $PROJECT"
          done

          if [ "$(curl -s -o /dev/null -w '%{http_code}' -H "$auth" "$project_api/$DOMAIN")" != "200" ]; then
            added=$(curl -s -X POST -H "$auth" -H 'Content-Type: application/json' \
              --data "{\"name\":\"$DOMAIN\"}" "$project_api")
            if [ "$(jq -r '.success' <<<"$added")" != "true" ]; then
              echo "::error::Adding $DOMAIN to $PROJECT failed (still attached to another project?): $(jq -c '.errors' <<<"$added")"; exit 1
            fi
            echo "Added $DOMAIN to $PROJECT"
          fi

          # Fails loudly: without this record the Pages domain stays "pending" forever
          records=$(curl -s -H "$auth" "$api/zones/$ZONE_ID/dns_records?name=$DOMAIN")
          if [ "$(jq -r '.success' <<<"$records")" != "true" ]; then
            echo "::error::Listing DNS records failed (token needs Zone > DNS: Edit): $(jq -c '.errors' <<<"$records")"; exit 1
          fi
          existing=$(jq -r '.result[] | "\(.type) \(.content)"' <<<"$records")
          record='{"type":"CNAME","name":"'"$DOMAIN"'","content":"'"$target"'","proxied":true}'
          if [ -z "$existing" ]; then
            result=$(curl -s -X POST -H "$auth" -H 'Content-Type: application/json' --data "$record" \
              "$api/zones/$ZONE_ID/dns_records")
          elif [ "$existing" = "CNAME $target" ]; then
            result='{"success":true}'
          elif grep -Eqx 'CNAME prket-alandlos-[a-z0-9-]+\.pages\.dev' <<<"$existing"; then
            id=$(jq -r '.result[0].id' <<<"$records")
            result=$(curl -s -X PUT -H "$auth" -H 'Content-Type: application/json' --data "$record" \
              "$api/zones/$ZONE_ID/dns_records/$id")
          else
            # Not overwritten automatically: it may be something set up on purpose
            echo "::error::$DOMAIN already has other DNS records; delete them so a CNAME to $target can be created:"
            echo "$existing"; exit 1
          fi
          if [ "$(jq -r '.success' <<<"$result")" != "true" ]; then
            echo "::error::Writing CNAME $DOMAIN -> $target failed: $(jq -c '.errors' <<<"$result")"; exit 1
          fi
          echo "CNAME $DOMAIN -> $target"
          echo "${{ matrix.repo }} -> https://$DOMAIN" >> "$GITHUB_STEP_SUMMARY"
