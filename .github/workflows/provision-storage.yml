name: Provision R2 + seed D1

# Step 1 (terraform): create/adopt the R2 bucket. The D1 database already
#                     exists in Cloudflare and is only referenced by ID.
# Step 2 (seed): upload sample images to R2 and create the D1 admin user
#                from the ADMIN_USERNAME / ADMIN_PASSWORD secrets.
on:
  push:
    branches: [master]
    paths:
      - 'storage/**'
      - 'seed/**'
      - '.github/workflows/provision-storage.yml'
  pull_request:
    paths:
      - 'storage/**'
  workflow_dispatch:
    inputs:
      reset_admin_password:
        description: 'Overwrite the admin password if the user already exists'
        type: boolean
        default: false

concurrency:
  group: provision-storage
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME || 'prket-andlos' }}
  CLOUDFLARE_DATABASE_ID: ${{ vars.CLOUDFLARE_DATABASE_ID }}
  STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'prket-terraform-state' }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storage
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_r2_bucket_name: ${{ vars.R2_BUCKET_NAME || 'prket-andlos' }}
      TF_VAR_cloudflare_database_id: ${{ vars.CLOUDFLARE_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      # The state bucket is created once by hand (see README); fail early if absent.
      - name: Check Terraform state bucket exists
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$STATE_BUCKET")
          if [ "$code" != "200" ]; then
            echo "State bucket '$STATE_BUCKET' not found (HTTP $code). Create it in R2 first."; exit 1
          fi

      - name: Terraform init
        run: |
          {
            echo "bucket    = \"$STATE_BUCKET\""
            echo "key       = \"storage/terraform.tfstate\""
            echo "endpoints = { s3 = \"https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com\" }"
          } > backend.hcl
          terraform init -backend-config=backend.hcl

      - name: Terraform fmt / validate
        run: |
          terraform fmt -check
          terraform validate

      # The prod bucket already exists: adopt it into state
      # instead of failing on "already exists".
      - name: Import existing resources
        if: github.event_name != 'pull_request'
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          state=$(terraform state list || true)

          if ! grep -qx 'cloudflare_r2_bucket.assets' <<<"$state" \
             && [ "$(curl -s -o /dev/null -w '%{http_code}' -H "$auth" "$api/r2/buckets/$R2_BUCKET_NAME")" = "200" ]; then
            terraform import cloudflare_r2_bucket.assets "$CLOUDFLARE_ACCOUNT_ID/$R2_BUCKET_NAME/default"
          fi

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false tfplan

  seed:
    needs: terraform
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - name: Seed R2 images and D1 admin user
        run: node provision.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DATABASE_ID: ${{ vars.CLOUDFLARE_DATABASE_ID }}
          ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RESET_ADMIN_PASSWORD: ${{ inputs.reset_admin_password }}

      - name: Verify R2 contains images
        run: |
          node --input-type=module <<'JS'
          import { S3Client, ListObjectsV2Command } from '@aws-sdk/client-s3';
          const s3 = new S3Client({
            region: 'auto',
            endpoint: `https://${process.env.CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com`,
            credentials: { accessKeyId: process.env.ACCESS_KEY_ID, secretAccessKey: process.env.SECRET_ACCESS_KEY },
          });
          const r = await s3.send(new ListObjectsV2Command({ Bucket: process.env.R2_BUCKET_NAME, Prefix: 'products/' }));
          const imgs = (r.Contents ?? []).filter((o) => /\.(jpe?g|png|webp)$/i.test(o.Key));
          console.log(`Images in R2 under products/: ${imgs.length}`);
          if (imgs.length === 0) { console.error('No images found in R2'); process.exit(1); }
          JS
        env:
          ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
