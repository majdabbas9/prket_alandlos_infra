name: IT - Admin Backend

# Integration tests against the deployed admin backend (/auth/* on the API Worker).
# Called by Provision right after its deploy job, or run manually. Tests: it/admin-backend.test.mjs
on:
  workflow_call:
    inputs:
      environment:
        description: 'dev or prod'
        type: string
        default: 'dev'
      api_url:
        description: 'API base URL (Provision passes the one it just deployed)'
        type: string
        required: false
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        type: choice
        options: ['dev', 'prod']
        default: 'dev'

concurrency:
  group: it-admin-backend-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  it:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || 'dev' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Manual runs: the same API URL Provision resolves for this environment
      - name: Resolve API URL
        run: |
          if [ -n "$API_URL" ]; then echo "API_URL=$API_URL" >> "$GITHUB_ENV"
          else node scripts/env-config.mjs | sed -n 's/^api_url=/API_URL=/p' >> "$GITHUB_ENV"; fi
        env:
          API_URL: ${{ inputs.api_url }}
          ENV_NAME: ${{ inputs.environment || 'dev' }}
          VARS_JSON: ${{ toJSON(vars) }}
          CLOUDFLARE_API_TOKEN: ${{ secrets[format('{0}_CLOUDFLARE_API_TOKEN', inputs.environment == 'prod' && 'PROD' || 'DEV')] || secrets.CLOUDFLARE_API_TOKEN }}

      - name: Run integration tests
        working-directory: it
        run: node --test --test-reporter=spec --test-reporter-destination=stdout admin-backend.test.mjs
        env:
          ADMIN_USERNAME: ${{ secrets[format('{0}_ADMIN_USERNAME', inputs.environment == 'prod' && 'PROD' || 'DEV')] || secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets[format('{0}_ADMIN_PASSWORD', inputs.environment == 'prod' && 'PROD' || 'DEV')] || secrets.ADMIN_PASSWORD }}
