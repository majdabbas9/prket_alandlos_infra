name: Terraform (Cloudflare)

on:
  push:
    branches: [master]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

# R2-backed state has no lock (no DynamoDB on Cloudflare); serialize all runs.
concurrency:
  group: terraform
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      # Provider auth (see README for required token permissions)
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # R2 S3 backend auth (same creds as ACCESS_KEY_ID / SECRET_ACCESS_KEY in .env)
      AWS_ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
      # Terraform variables from repo Variables (non-secret)
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_zone_name: ${{ vars.ZONE_NAME }}
      TF_VAR_vps_ip: ${{ vars.VPS_IP }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform Init (R2 backend)
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=cloudflare/terraform.tfstate" \
            -backend-config="endpoints.s3=https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan > tfplan.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('cloudflare/tfplan.txt', 'utf8');
            const body = `#### Terraform Plan (\`cloudflare\`)\n\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Terraform Apply
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: terraform apply -input=false tfplan
