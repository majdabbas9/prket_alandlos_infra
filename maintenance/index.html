<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Alandlos Parquet — Back soon</title>
  <!-- Published to both Pages projects by .github/workflows/power.yml (state: off). -->
  <style>
    :root { --bg: #f7f3ee; --fg: #2b2118; --muted: #7a6a5a; --line: #e2d8cc; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1c1712; --fg: #f1e9df; --muted: #b3a493; --line: #3a3027; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
           background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 480px; width: 100%; text-align: center; }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    p { margin: 0; color: var(--muted); line-height: 1.6; }
    section + section { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line); }
  </style>
</head>
<body>
  <main>
    <section lang="en">
      <h1>We'll be back soon</h1>
      <p>Alandlos Parquet is temporarily offline. Please check back later.</p>
    </section>
    <section lang="ar" dir="rtl">
      <h1>سنعود قريباً</h1>
      <p>موقع الأندلس للباركيه متوقف مؤقتاً. يرجى العودة لاحقاً.</p>
    </section>
    <section lang="he" dir="rtl">
      <h1>נחזור בקרוב</h1>
      <p>האתר של אלאנדלוס פרקט אינו זמין כרגע. נסו שוב מאוחר יותר.</p>
    </section>
  </main>
</body>
</html>
